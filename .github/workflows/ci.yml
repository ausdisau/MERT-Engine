name: ci

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.x'
          cache: npm
      - run: npm install
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run build:web
